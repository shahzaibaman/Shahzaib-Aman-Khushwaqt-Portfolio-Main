# ──────────────────────────────────────────────────────────────────────────
#  GitHub Actions — Deploy to GitHub Pages
#  Triggers on every push to the `main` branch.
#  Builds with Vite, then publishes the `dist/` folder to GitHub Pages.
# ──────────────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # also lets you trigger manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── KEY: pass the repo name as the Vite base so asset paths are correct ──
      # If you use a custom domain (CNAME file in /public), change VITE_BASE_URL to /
      - name: Build
        run: npm run build
        env:
          # Change '/my-portfolio/' to match YOUR repo name,
          # OR set this to '/' if you use a custom domain or username.github.io root.
          VITE_BASE_URL: '/shahzaibaman/Shahzaib-Aman-Khushwaqt-Portfolio-Main/'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
